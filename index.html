<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Drum Kit</title>
    <link rel="stylesheet" href="style.css">

  </head>
  <body>
      <h1> Drum kit!</h1>
<div class="main">

  <button class="one drum"> 1</button>
  <button class="two drum">  2</button>
  <button class="three drum"> 3 </button>
  <button class="four drum"> 4</button>
  <button class="five drum">  5</button>
  <button class="six drum"> 6</button>
  <button class="seven drum">  7</button>
</div>
<div class="instruction">
  !! Press The shown Keys to Produce Sound !!
</div>


    <script src="index.js" charset="utf-8"></script>
  </body>
</html>
